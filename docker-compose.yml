services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shoptt-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1434:1433"
    volumes:
      - shoptt_sqlserver_data:/var/opt/mssql
      - ./docker/mssql/backup:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" >/dev/null 2>&1 || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: shoptt-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_USER: ${DB_USER:-shoptt_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_DATABASE: ${DB_DATABASE:-ShopTT}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: shoptt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  shoptt_sqlserver_data:
